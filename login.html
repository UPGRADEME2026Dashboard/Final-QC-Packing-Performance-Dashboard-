<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Dashboard Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="auth.js"></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <img src="upgrade-logo.png" alt="Upgrade" class="login-logo" onerror="this.style.display='none'">
        <h1 class="login-title">Dashboard Login</h1>

        <form id="loginForm" autocomplete="off">
            <div class="login-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username" value="upgrade@upgrade.com" required>
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <label class="login-options">
                <input id="rememberSession" type="checkbox">
                <span>Remember Session</span>
            </label>

            <button class="login-btn" type="submit">
                <i class="fas fa-right-to-bracket"></i> Login
            </button>

            <div class="login-error" id="loginError"></div>
        </form>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const error = document.getElementById('loginError');
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            error.textContent = '';
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('rememberSession').checked;

            try {
                await window.UpgradeAuth.login(email, password, remember);
                window.location.replace('index.html');
            } catch (err) {
                error.textContent = 'Invalid email or password';
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-right-to-bracket"></i> Login';
            }
        });
    </script>
</body>
</html>
